<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>انبار دارایی‌ها | آذین طب سلامت رازی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1013;
    --bg-panel: #121A1E;
    --bg-elevated: #17222A;
    --bg-elevated-hover: #1D2A33;
    --border: rgba(233,240,242,0.09);
    --border-strong: rgba(233,240,242,0.16);
    --text: #E7EEF0;
    --text-dim: #90A3A9;
    --text-faint: #5E7075;
    --accent: #17A860;
    --accent-soft: rgba(23,168,96,0.14);
    --accent-strong: #22C773;
    --bronze: #2D53AE;
    --bronze-soft: rgba(45,83,174,0.16);
    --danger: #E2594C;
    --danger-soft: rgba(226,89,76,0.14);
    --warn: #E0A73B;
    --warn-soft: rgba(224,167,59,0.14);
    --ok: #3FB27F;
    --ok-soft: rgba(63,178,127,0.14);
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
    --radius: 14px;
    --radius-sm: 9px;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EEF2F2;
      --bg-panel: #FFFFFF;
      --bg-elevated: #FFFFFF;
      --bg-elevated-hover: #F3F7F7;
      --border: rgba(13,26,28,0.09);
      --border-strong: rgba(13,26,28,0.18);
      --text: #10191B;
      --text-dim: #57696D;
      --text-faint: #8B9BA0;
      --accent: #0E8B52;
      --accent-soft: rgba(14,139,82,0.10);
      --accent-strong: #0B6E41;
      --bronze: #1E3F8F;
      --bronze-soft: rgba(30,63,143,0.10);
      --danger: #C8483C;
      --danger-soft: rgba(200,72,60,0.09);
      --warn: #B4801F;
      --warn-soft: rgba(180,128,31,0.10);
      --ok: #2A9464;
      --ok-soft: rgba(42,148,100,0.09);
      --shadow: 0 20px 50px rgba(20,30,32,0.12);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #EEF2F2;
    --bg-panel: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --bg-elevated-hover: #F3F7F7;
    --border: rgba(13,26,28,0.09);
    --border-strong: rgba(13,26,28,0.18);
    --text: #10191B;
    --text-dim: #57696D;
    --text-faint: #8B9BA0;
    --accent: #0E8B52;
    --accent-soft: rgba(14,139,82,0.10);
    --accent-strong: #0B6E41;
    --bronze: #1E3F8F;
    --bronze-soft: rgba(30,63,143,0.10);
    --danger: #C8483C;
    --danger-soft: rgba(200,72,60,0.09);
    --warn: #B4801F;
    --warn-soft: rgba(180,128,31,0.10);
    --ok: #2A9464;
    --ok-soft: rgba(42,148,100,0.09);
    --shadow: 0 20px 50px rgba(20,30,32,0.12);
    color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background .3s ease, color .3s ease;
  }
  #particles {
    position: fixed; inset: 0; z-index: 0; opacity: .55; pointer-events: none;
  }
  .app-root { position: relative; z-index: 1; min-height: 100vh; }

  ::selection { background: var(--accent); color: #06110F; }

  /* ---------- Brand mark ---------- */
  .header-logo {
    width: 40px; height: 40px; object-fit: contain; flex-shrink: 0;
  }
  .brand-logo {
    width: 148px; max-width: 100%; object-fit: contain; display: block;
  }

  /* ---------- Login screen ---------- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; z-index: 1;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 30px 30px;
    text-align: center;
    animation: rise .5s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 26px; }
  .login-brand h1 { font-size: 17px; font-weight: 700; margin: 4px 0 0; letter-spacing: .2px; }
  .login-brand p { font-size: 12.5px; color: var(--text-dim); margin: 2px 0 0; }
  .field { text-align: right; margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-strong);
    color: var(--text); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 14px;
    font-family: inherit; outline: none; transition: border-color .2s ease, background .2s ease;
  }
  .field input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; margin-top: 10px; background: var(--accent); color: #06110F; border: none;
    border-radius: var(--radius-sm); padding: 12px; font-size: 14.5px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .2s ease, transform .1s ease;
  }
  .login-btn:hover { background: var(--accent-strong); }
  .login-btn:active { transform: scale(.98); }
  .login-error {
    margin-top: 12px; font-size: 12.5px; color: var(--danger); min-height: 16px;
  }

  /* ---------- App shell ---------- */
  .app-header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg-panel) 88%, transparent);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 5;
  }
  .app-header .brand-text { display: flex; flex-direction: column; line-height: 1.3; }
  .app-header .brand-text strong { font-size: 15px; font-weight: 700; }
  .app-header .brand-text span { font-size: 11.5px; color: var(--text-dim); }
  .header-spacer { flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg-elevated); color: var(--text); display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: background .2s ease;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-elevated-hover); }
  .icon-btn svg { width: 18px; height: 18px; }
  .logout-btn {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text-dim);
    border-radius: 10px; padding: 0 13px; height: 38px; font-family: inherit; font-size: 13px;
    cursor: pointer; transition: color .2s ease, background .2s ease;
  }
  .logout-btn:hover { color: var(--danger); background: var(--bg-elevated-hover); }

  main { max-width: 920px; margin: 0 auto; padding: 40px 20px 80px; }

  /* ---------- Dashboard stats ---------- */
  .stats-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 30px;
  }
  .stat-card {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 14px; text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .stat-card .lbl { font-size: 11.5px; color: var(--text-dim); }
  .stat-card.tone-total .num { color: var(--text); }
  .stat-card.tone-inuse .num { color: var(--ok); }
  .stat-card.tone-store .num { color: var(--accent); }
  .stat-card.tone-repair .num { color: var(--warn); }
  .stat-card.tone-retired .num { color: var(--danger); }
  @media (max-width: 700px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

  .hero-search {
    text-align: center; margin-bottom: 34px; position: relative;
  }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--accent);
    background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s ease infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .hero-search h2 { font-size: 21px; font-weight: 800; margin: 0 0 6px; }
  .hero-search p { font-size: 13.5px; color: var(--text-dim); margin: 0 0 22px; }
  .suggest-box {
    max-width: 560px; margin: 8px auto 0; background: var(--bg-panel); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); overflow: hidden; text-align: right; box-shadow: var(--shadow);
  }
  .suggest-item { padding: 11px 16px; cursor: pointer; font-size: 13.5px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover { background: var(--bg-elevated-hover); }
  .suggest-item .s-name { font-weight: 600; }
  .suggest-item .s-code { color: var(--text-faint); font-size: 12px; direction: ltr; }
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-panel); border: 1px solid var(--border-strong);
    border-radius: 999px; padding: 6px 8px 6px 18px; max-width: 560px; margin: 0 auto;
    box-shadow: var(--shadow);
  }
  .search-bar svg { width: 18px; height: 18px; color: var(--text-faint); flex-shrink: 0; }
  .search-bar input {
    flex: 1; border: none; background: transparent; outline: none; color: var(--text);
    font-family: inherit; font-size: 14.5px; padding: 10px 0;
  }
  .search-bar input::placeholder { color: var(--text-faint); }
  .search-bar button {
    background: var(--accent); color: #06110F; border: none; border-radius: 999px;
    padding: 11px 22px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
    transition: background .2s ease; flex-shrink: 0;
  }
  .search-bar button:hover { background: var(--accent-strong); }

  /* ---------- Result card ---------- */
  .result-wrap { max-width: 560px; margin: 0 auto 40px; min-height: 2px; }
  .result-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px 26px 22px; box-shadow: var(--shadow);
    animation: rise .35s ease;
  }
  .result-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .result-top .name { font-size: 18px; font-weight: 800; }
  .result-top .code { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .status-badge {
    font-size: 11.5px; font-weight: 700; padding: 5px 11px; border-radius: 999px; white-space: nowrap;
  }
  .status-inuse { background: var(--ok-soft); color: var(--ok); }
  .status-store { background: var(--accent-soft); color: var(--accent); }
  .status-repair { background: var(--warn-soft); color: var(--warn); }
  .status-retired { background: var(--danger-soft); color: var(--danger); }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-bottom: 16px; }
  .result-item .k { font-size: 11.5px; color: var(--text-faint); margin-bottom: 3px; }
  .result-item .v { font-size: 14px; font-weight: 600; }
  .result-note { font-size: 13px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }

  .call-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--bronze-soft); color: var(--bronze); border: 1px solid transparent;
    border-radius: var(--radius-sm); padding: 12px; font-family: inherit; font-size: 14px;
    font-weight: 700; text-decoration: none; margin-top: 6px; transition: background .2s ease;
  }
  .call-btn:hover { background: var(--bronze); color: #180E04; }
  .call-btn svg { width: 16px; height: 16px; }

  .not-found {
    text-align: center; padding: 26px; color: var(--text-dim); font-size: 13.5px;
    background: var(--bg-panel); border: 1px dashed var(--border-strong); border-radius: var(--radius);
  }

  /* ---------- List section ---------- */
  .list-section-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .list-section-head h3 { font-size: 15px; font-weight: 700; margin: 0; flex: 1; }
  .count-pill { font-size: 12px; color: var(--text-dim); background: var(--bg-elevated); padding: 4px 10px; border-radius: 999px; }
  .add-btn {
    display: flex; align-items: center; gap: 7px;
    background: var(--accent); color: #06110F; border: none; border-radius: var(--radius-sm);
    padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background .2s ease;
  }
  .add-btn:hover { background: var(--accent-strong); }
  .add-btn svg { width: 15px; height: 15px; }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filter-bar select {
    background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text-dim);
    border-radius: var(--radius-sm); padding: 8px 10px; font-family: inherit; font-size: 12.5px; outline: none;
  }

  .activity-feed { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .activity-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: flex-start; }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .activity-dot.created { background: var(--accent); }
  .activity-dot.transferred { background: var(--bronze); }
  .activity-item .a-text { flex: 1; }
  .activity-item .a-time { font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }

  .history-row { padding: 12px 16px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .history-row .h-entry { display: flex; justify-content: space-between; padding: 5px 0; color: var(--text-dim); }
  .history-row .h-entry b { color: var(--text); font-weight: 600; }

  .asset-table { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-panel); }
  .asset-row {
    display: grid; grid-template-columns: 90px 1.2fr 0.9fr 0.9fr 90px 104px;
    gap: 10px; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px; cursor: pointer; transition: background .15s ease;
  }
  .asset-row:last-child { border-bottom: none; }
  .asset-row:hover { background: var(--bg-elevated-hover); }
  .asset-row.head { cursor: default; font-size: 11.5px; color: var(--text-faint); font-weight: 700; background: var(--bg-elevated); }
  .asset-row.head:hover { background: var(--bg-elevated); }
  .cell-code { color: var(--accent); font-weight: 700; font-family: inherit; direction: ltr; text-align: right; }
  .cell-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .row-icon-btn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--bg-elevated); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim); transition: color .2s ease, background .2s ease;
  }
  .row-icon-btn:hover { color: var(--text); background: var(--bg-elevated-hover); }
  .row-icon-btn.danger:hover { color: var(--danger); }
  .row-icon-btn svg { width: 14px; height: 14px; }

  .empty-state {
    text-align: center; padding: 46px 20px; color: var(--text-dim);
  }
  .empty-state svg { width: 40px; height: 40px; color: var(--text-faint); margin-bottom: 12px; }
  .empty-state p { font-size: 13.5px; margin: 0 0 18px; }

  @media (max-width: 640px) {
    .asset-row { grid-template-columns: 70px 1fr 96px; }
    .asset-row .col-dept, .asset-row .col-assignee { display: none; }
    .result-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4,8,9,0.55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
    background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 26px; box-shadow: var(--shadow); animation: rise .25s ease;
  }
  .modal-card h3 { font-size: 16px; font-weight: 800; margin: 0 0 18px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field select {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-strong);
    color: var(--text); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  .field textarea {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-strong);
    color: var(--text); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 13.5px;
    font-family: inherit; outline: none; resize: vertical; min-height: 60px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-secondary {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text-dim);
    border-radius: var(--radius-sm); padding: 11px; font-family: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    flex: 1.4; background: var(--accent); border: none; color: #06110F;
    border-radius: var(--radius-sm); padding: 11px; font-family: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-strong); }
  .form-error { font-size: 12px; color: var(--danger); margin-top: 4px; min-height: 14px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text);
    padding: 11px 20px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="app-root">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">

<script>
(function () {
  "use strict";

  /* ---------------- Theme ---------------- */
  var root = document.documentElement;
  function currentTheme() {
    var stored = root.getAttribute('data-theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function applyThemeIcon() {
    var t = currentTheme();
    var btn = document.getElementById('themeToggle');
    btn.innerHTML = t === 'light'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = currentTheme() === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    applyThemeIcon();
  });
  applyThemeIcon();

  /* ---------------- Particle network background ---------------- */
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var W, H, particles = [];
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function initParticles() {
    var count = Math.min(70, Math.floor((W * H) / 22000));
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25
      });
    }
  }
  function getAccentRGB() {
    var light = currentTheme() === 'light';
    return light ? '14,139,82' : '34,199,115';
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    var rgb = getAccentRGB();
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var a = particles[i], b = particles[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 130) {
          ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.14 * (1 - dist / 130)) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(' + rgb + ',0.55)';
      ctx.beginPath(); ctx.arc(particles[i].x, particles[i].y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  resize(); initParticles(); tick();
  window.addEventListener('resize', function () { resize(); initParticles(); });

  /* ---------------- Login ---------------- */
  var VALID_USER = "MohammadAb";
  var VALID_PASS = "3659";
  var loginScreen = document.getElementById('loginScreen');
  var appScreen = document.getElementById('appScreen');

  function showApp() {
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    initDb();
  }
  function showLogin() {
    appScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  }

  if (sessionStorage.getItem('medazinco_asset_auth') === '1') {
    showApp();
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value;
    var err = document.getElementById('loginError');
    if (u === VALID_USER && p === VALID_PASS) {
      err.textContent = '';
      sessionStorage.setItem('medazinco_asset_auth', '1');
      showApp();
    } else {
      err.textContent = 'نام کاربری یا رمز عبور اشتباه است';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem('medazinco_asset_auth');
    document.getElementById('loginPass').value = '';
    showLogin();
  });

  /* ---------------- Toast ---------------- */
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------------- Status labels ---------------- */
  var STATUS_LABEL = { inuse: 'در حال استفاده', store: 'در انبار', repair: 'در تعمیر', retired: 'اسقاط' };
  var STATUS_CLASS = { inuse: 'status-inuse', store: 'status-store', repair: 'status-repair', retired: 'status-retired' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------------- Date/time helpers ---------------- */
  function nowIso() { return new Date().toISOString(); }
  function faDateTime(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      return d.toLocaleString('fa-IR', { dateStyle: 'medium', timeStyle: 'short' });
    } catch (e) { return '—'; }
  }
  function faDate(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('fa-IR', { dateStyle: 'medium' });
    } catch (e) { return '—'; }
  }

  /* ---------------- App state ---------------- */
  var assets = [];   // [{id, code, name, category, assignee, department, phone, location, status, deliveryDate, notes, createdAt, updatedAt, history:[]}]
  var dbNs = null;
  var dbReady = false;
  var localFallback = []; // used only if db capability unavailable
  var filters = { category: '', department: '', status: '', sort: 'newest' };

  function persistLocalFallback() {
    try { localStorage.setItem('medazinco_assets_fallback', JSON.stringify(localFallback)); } catch (e) {}
  }
  function loadLocalFallback() {
    try {
      var raw = localStorage.getItem('medazinco_assets_fallback');
      if (raw) localFallback = JSON.parse(raw);
    } catch (e) { localFallback = []; }
  }

  async function initDb() {
    try {
      dbNs = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null;
    } catch (e) { dbNs = null; }

    if (dbNs) {
      dbReady = true;
      try {
        dbNs.collection('assets').onSnapshot(function (snap) {
          assets = snap.docs.map(function (d) {
            var data = d.data() || {};
            data.id = d.id;
            return data;
          });
          renderAll();
        }, function (err) {
          toast('اتصال به پایگاه‌داده قطع شد');
        });
      } catch (e) {
        dbReady = false;
        loadLocalFallback();
        assets = localFallback.slice();
        renderAll();
      }
    } else {
      dbReady = false;
      loadLocalFallback();
      assets = localFallback.slice();
      renderAll();
    }
  }

  async function saveAsset(data, editingId) {
    if (dbReady && dbNs) {
      var col = dbNs.collection('assets');
      if (editingId) {
        await col.doc(editingId).update(data);
      } else {
        await col.add(data);
      }
    } else {
      if (editingId) {
        var idx = localFallback.findIndex(function (a) { return a.id === editingId; });
        if (idx > -1) localFallback[idx] = Object.assign({ id: editingId }, data);
      } else {
        localFallback.push(Object.assign({ id: 'local_' + Date.now() }, data));
      }
      persistLocalFallback();
      assets = localFallback.slice();
      renderAll();
    }
  }

  async function deleteAsset(id) {
    if (dbReady && dbNs) {
      await dbNs.collection('assets').doc(id).delete();
    } else {
      localFallback = localFallback.filter(function (a) { return a.id !== id; });
      persistLocalFallback();
      assets = localFallback.slice();
      renderAll();
    }
  }

  /* ---------------- Rendering ---------------- */
  function renderAll() {
    renderStats();
    populateFilterOptions();
    renderList();
    renderActivity();
    var q = document.getElementById('searchInput').value.trim();
    if (q) renderResult(q);
  }

  function renderStats() {
    var el = document.getElementById('statsRow');
    var byStatus = { inuse: 0, store: 0, repair: 0, retired: 0 };
    assets.forEach(function (a) { byStatus[a.status] = (byStatus[a.status] || 0) + 1; });
    var cards = [
      { tone: 'total', num: assets.length, lbl: 'کل دارایی‌ها' },
      { tone: 'inuse', num: byStatus.inuse, lbl: 'در حال استفاده' },
      { tone: 'store', num: byStatus.store, lbl: 'در انبار' },
      { tone: 'repair', num: byStatus.repair, lbl: 'در تعمیر' },
      { tone: 'retired', num: byStatus.retired, lbl: 'اسقاط' }
    ];
    el.innerHTML = cards.map(function (c) {
      return '<div class="stat-card tone-' + c.tone + '"><div class="num">' + toFaDigits(c.num) + '</div><div class="lbl">' + c.lbl + '</div></div>';
    }).join('');
  }

  function populateFilterOptions() {
    var catSel = document.getElementById('filterCategory');
    var deptSel = document.getElementById('filterDepartment');
    var cats = Array.from(new Set(assets.map(function (a) { return a.category; }).filter(Boolean)));
    var depts = Array.from(new Set(assets.map(function (a) { return a.department; }).filter(Boolean)));
    var curCat = catSel.value, curDept = deptSel.value;
    catSel.innerHTML = '<option value="">همه دسته‌ها</option>' + cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    deptSel.innerHTML = '<option value="">همه واحدها</option>' + depts.map(function (d) { return '<option value="' + esc(d) + '">' + esc(d) + '</option>'; }).join('');
    catSel.value = cats.indexOf(curCat) > -1 ? curCat : '';
    deptSel.value = depts.indexOf(curDept) > -1 ? curDept : '';
  }

  function applyFiltersSort(list) {
    var out = list.filter(function (a) {
      if (filters.category && a.category !== filters.category) return false;
      if (filters.department && a.department !== filters.department) return false;
      if (filters.status && a.status !== filters.status) return false;
      return true;
    });
    if (filters.sort === 'name') {
      out.sort(function (a, b) { return (a.name || '').localeCompare(b.name || '', 'fa'); });
    } else if (filters.sort === 'code') {
      out.sort(function (a, b) { return (a.code || '').localeCompare(b.code || ''); });
    } else {
      out.sort(function (a, b) { return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); });
    }
    return out;
  }

  function statusBadge(status) {
    var cls = STATUS_CLASS[status] || 'status-store';
    var label = STATUS_LABEL[status] || 'در انبار';
    return '<span class="status-badge ' + cls + '">' + esc(label) + '</span>';
  }

  function findMatches(query) {
    var qLower = query.toLowerCase();
    return assets.filter(function (a) {
      return (a.code || '').toLowerCase().indexOf(qLower) > -1 ||
        (a.name || '').toLowerCase().indexOf(qLower) > -1 ||
        (a.assignee || '').toLowerCase().indexOf(qLower) > -1;
    });
  }

  function renderResult(query) {
    var wrap = document.getElementById('resultWrap');
    var qLower = query.toLowerCase();
    var exact = assets.find(function (a) { return (a.code || '').toLowerCase() === qLower; });
    var found = findMatches(query);
    var match = exact || found[0];

    if (!match) {
      wrap.innerHTML = '<div class="not-found">دارایی‌ای با این کد، نام یا شخص پیدا نشد</div>';
      return;
    }

    var html = '';
    html += '<div class="result-card">';
    html += '<div class="result-top"><div><div class="name">' + esc(match.name) + '</div><div class="code">کد اموال: ' + esc(match.code) + '</div></div>' + statusBadge(match.status) + '</div>';
    html += '<div class="result-grid">';
    html += '<div class="result-item"><div class="k">شخص مسئول</div><div class="v">' + esc(match.assignee) + '</div></div>';
    html += '<div class="result-item"><div class="k">واحد</div><div class="v">' + esc(match.department) + '</div></div>';
    html += '<div class="result-item"><div class="k">محل</div><div class="v">' + esc(match.location || '—') + '</div></div>';
    html += '<div class="result-item"><div class="k">تاریخ تحویل</div><div class="v">' + esc(match.deliveryDate || faDate(match.createdAt)) + '</div></div>';
    html += '</div>';
    if (match.notes) html += '<div class="result-note">' + esc(match.notes) + '</div>';
    if (match.phone) {
      html += '<a class="call-btn" href="tel:' + esc(match.phone) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>تماس با ' + esc(match.assignee) + ' (' + esc(match.phone) + ')</a>';
    }
    var hist = (match.history || []).slice().reverse().slice(0, 6);
    if (hist.length) {
      html += '<div class="history-row" style="margin-top:14px;border-radius:var(--radius-sm);border-bottom:none;">';
      html += '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:6px;">تاریخچه</div>';
      hist.forEach(function (h) {
        var label = h.type === 'created' ? 'ثبت اولیه دارایی' :
          h.type === 'transferred' ? ('انتقال به ' + esc(h.to || '') + (h.from ? ' (از ' + esc(h.from) + ')' : '')) : 'ویرایش اطلاعات';
        html += '<div class="h-entry"><span><b>' + label + '</b></span><span>' + faDateTime(h.at) + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    wrap.innerHTML = html;
  }

  function renderList() {
    var listWrap = document.getElementById('listWrap');
    var countPill = document.getElementById('countPill');
    countPill.textContent = toFaDigits(assets.length) + ' مورد';

    if (assets.length === 0) {
      listWrap.innerHTML =
        '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 12px;display:block;"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>' +
        '<p>هنوز دارایی‌ای ثبت نشده — یکی اضافه کنید تا این‌جا ظاهر بشود</p>' +
        '<button class="add-btn" id="emptyAddBtn" type="button" style="margin:0 auto;">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>افزودن دارایی</button>' +
        '</div>';
      document.getElementById('emptyAddBtn').addEventListener('click', openAddModal);
      return;
    }

    var sorted = applyFiltersSort(assets.slice());
    var html = '<div class="asset-table">';
    html += '<div class="asset-row head"><div>کد</div><div>نام کالا</div><div class="col-assignee">شخص مسئول</div><div class="col-dept">واحد</div><div>وضعیت</div><div></div></div>';
    sorted.forEach(function (a) {
      html += '<div class="asset-row" data-code="' + esc(a.code) + '" title="ثبت: ' + faDateTime(a.createdAt) + '">';
      html += '<div class="cell-code">' + esc(a.code) + '</div>';
      html += '<div class="cell-name">' + esc(a.name) + '</div>';
      html += '<div class="col-assignee">' + esc(a.assignee) + '</div>';
      html += '<div class="col-dept">' + esc(a.department) + '</div>';
      html += '<div>' + statusBadge(a.status) + '</div>';
      html += '<div class="cell-actions">' +
        '<div class="row-icon-btn" data-transfer="' + esc(a.id) + '" title="انتقال به شخص دیگر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>' +
        '<div class="row-icon-btn" data-edit="' + esc(a.id) + '" title="ویرایش"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></div>' +
        '<div class="row-icon-btn danger" data-delete="' + esc(a.id) + '" title="حذف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></div>' +
        '</div>';
      html += '</div>';
    });
    html += '</div>';
    listWrap.innerHTML = html;

    if (sorted.length === 0) {
      listWrap.innerHTML = '<div class="not-found">با این فیلترها نتیجه‌ای پیدا نشد</div>';
    }

    listWrap.querySelectorAll('.asset-row[data-code]').forEach(function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('[data-edit]') || e.target.closest('[data-delete]') || e.target.closest('[data-transfer]')) return;
        document.getElementById('searchInput').value = row.getAttribute('data-code');
        renderResult(row.getAttribute('data-code'));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    listWrap.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openEditModal(btn.getAttribute('data-edit'));
      });
    });
    listWrap.querySelectorAll('[data-transfer]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openTransferModal(btn.getAttribute('data-transfer'));
      });
    });
    listWrap.querySelectorAll('[data-delete]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-delete');
        var a = assets.find(function (x) { return x.id === id; });
        if (confirm('حذف «' + (a ? a.name : '') + '» انجام شود؟')) {
          deleteAsset(id).then(function () { toast('دارایی حذف شد'); });
        }
      });
    });
  }

  /* ---------------- Activity feed ---------------- */
  function renderActivity() {
    var section = document.getElementById('activitySection');
    var feed = document.getElementById('activityFeed');
    var items = [];
    assets.forEach(function (a) {
      (a.history || []).forEach(function (h) {
        items.push({ asset: a, h: h });
      });
    });
    items.sort(function (x, y) { return new Date(y.h.at || 0) - new Date(x.h.at || 0); });
    items = items.slice(0, 15);
    if (!items.length) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    feed.innerHTML = items.map(function (it) {
      var h = it.h, a = it.asset;
      var text = h.type === 'created'
        ? ('<b>' + esc(a.name) + '</b> (' + esc(a.code) + ') ثبت شد — تحویل ' + esc(a.assignee))
        : h.type === 'transferred'
          ? ('<b>' + esc(a.name) + '</b> (' + esc(a.code) + ') به ' + esc(h.to || '') + ' منتقل شد')
          : ('اطلاعات <b>' + esc(a.name) + '</b> (' + esc(a.code) + ') ویرایش شد');
      return '<div class="activity-item"><div class="activity-dot ' + (h.type === 'created' ? 'created' : 'transferred') + '"></div>' +
        '<div class="a-text">' + text + '</div><div class="a-time">' + faDateTime(h.at) + '</div></div>';
    }).join('');
  }

  function toFaDigits(n) {
    var map = { '0': '۰', '1': '۱', '2': '۲', '3': '۳', '4': '۴', '5': '۵', '6': '۶', '7': '۷', '8': '۸', '9': '۹' };
    return String(n).replace(/[0-9]/g, function (d) { return map[d]; });
  }

  /* ---------------- Search + live suggestions ---------------- */
  var searchInput = document.getElementById('searchInput');
  var suggestBox = document.getElementById('suggestBox');

  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = searchInput.value.trim();
    suggestBox.classList.add('hidden');
    if (!q) { document.getElementById('resultWrap').innerHTML = ''; return; }
    renderResult(q);
  });

  searchInput.addEventListener('input', function () {
    var q = searchInput.value.trim();
    if (!q) { suggestBox.classList.add('hidden'); suggestBox.innerHTML = ''; return; }
    var found = findMatches(q).slice(0, 6);
    if (!found.length) { suggestBox.classList.add('hidden'); suggestBox.innerHTML = ''; return; }
    suggestBox.innerHTML = found.map(function (a) {
      return '<div class="suggest-item" data-pick="' + esc(a.code) + '"><span class="s-name">' + esc(a.name) + ' — ' + esc(a.assignee) + '</span><span class="s-code">' + esc(a.code) + '</span></div>';
    }).join('');
    suggestBox.classList.remove('hidden');
    suggestBox.querySelectorAll('[data-pick]').forEach(function (item) {
      item.addEventListener('click', function () {
        searchInput.value = item.getAttribute('data-pick');
        suggestBox.classList.add('hidden');
        renderResult(searchInput.value);
      });
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.hero-search')) suggestBox.classList.add('hidden');
  });

  /* ---------------- Filter bar ---------------- */
  ['filterCategory', 'filterDepartment', 'filterStatus', 'sortBy'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      filters.category = document.getElementById('filterCategory').value;
      filters.department = document.getElementById('filterDepartment').value;
      filters.status = document.getElementById('filterStatus').value;
      filters.sort = document.getElementById('sortBy').value;
      renderList();
    });
  });

  /* ---------------- CSV export ---------------- */
  document.getElementById('exportBtn').addEventListener('click', async function () {
    if (!assets.length) { toast('دارایی‌ای برای خروجی گرفتن وجود ندارد'); return; }
    var headers = ['کد اموال', 'نام کالا', 'دسته‌بندی', 'شخص مسئول', 'واحد', 'شماره تماس', 'محل', 'وضعیت', 'تاریخ تحویل', 'توضیحات', 'تاریخ ثبت'];
    var rows = assets.map(function (a) {
      return [a.code, a.name, a.category, a.assignee, a.department, a.phone, a.location, STATUS_LABEL[a.status] || a.status, a.deliveryDate, a.notes, faDateTime(a.createdAt)]
        .map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    });
    var csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
    try {
      var downloads = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
      if (downloads) {
        await downloads.save({ filename: 'anbar-daraeiha.csv', data: csv });
        return;
      }
    } catch (e) {}
    try {
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = 'anbar-daraeiha.csv';
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (e) { toast('خروجی گرفتن انجام نشد'); }
  });

  /* ---------------- Modal ---------------- */
  var modalOverlay = document.getElementById('modalOverlay');
  var assetForm = document.getElementById('assetForm');

  function openAddModal() {
    document.getElementById('modalTitle').textContent = 'افزودن دارایی جدید';
    document.getElementById('editingDocId').value = '';
    assetForm.reset();
    document.getElementById('formError').textContent = '';
    modalOverlay.classList.remove('hidden');
    document.getElementById('f_code').focus();
  }
  function openEditModal(id) {
    var a = assets.find(function (x) { return x.id === id; });
    if (!a) return;
    document.getElementById('modalTitle').textContent = 'ویرایش دارایی';
    document.getElementById('editingDocId').value = id;
    document.getElementById('f_code').value = a.code || '';
    document.getElementById('f_category').value = a.category || 'تجهیزات رایانه‌ای';
    document.getElementById('f_name').value = a.name || '';
    document.getElementById('f_assignee').value = a.assignee || '';
    document.getElementById('f_department').value = a.department || '';
    document.getElementById('f_phone').value = a.phone || '';
    document.getElementById('f_status').value = a.status || 'inuse';
    document.getElementById('f_location').value = a.location || '';
    document.getElementById('f_date').value = a.deliveryDate || '';
    document.getElementById('f_notes').value = a.notes || '';
    document.getElementById('formError').textContent = '';
    modalOverlay.classList.remove('hidden');
  }
  function closeModal() { modalOverlay.classList.add('hidden'); }

  document.getElementById('addBtn').addEventListener('click', openAddModal);
  document.getElementById('cancelModal').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function (e) { if (e.target === modalOverlay) closeModal(); });

  assetForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('f_code').value.trim();
    var name = document.getElementById('f_name').value.trim();
    var assignee = document.getElementById('f_assignee').value.trim();
    var department = document.getElementById('f_department').value.trim();
    var phone = document.getElementById('f_phone').value.trim();
    var editingId = document.getElementById('editingDocId').value;

    if (!code || !name || !assignee || !department || !phone) {
      document.getElementById('formError').textContent = 'همه فیلدهای ستاره‌دار الزامی هستند';
      return;
    }
    var dup = assets.find(function (a) { return a.code.toLowerCase() === code.toLowerCase() && a.id !== editingId; });
    if (dup) {
      document.getElementById('formError').textContent = 'این کد اموال قبلاً برای «' + dup.name + '» ثبت شده است';
      return;
    }

    var now = nowIso();
    var existing = editingId ? assets.find(function (a) { return a.id === editingId; }) : null;
    var data = {
      code: code,
      name: name,
      category: document.getElementById('f_category').value,
      assignee: assignee,
      department: department,
      phone: phone,
      status: document.getElementById('f_status').value,
      location: document.getElementById('f_location').value.trim(),
      deliveryDate: document.getElementById('f_date').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
      updatedAt: now
    };

    if (existing) {
      var history = (existing.history || []).slice();
      if (existing.assignee !== assignee) {
        history.push({ type: 'transferred', at: now, from: existing.assignee, to: assignee });
      } else {
        history.push({ type: 'edited', at: now });
      }
      data.history = history;
      data.createdAt = existing.createdAt || now;
    } else {
      data.createdAt = now;
      data.history = [{ type: 'created', at: now }];
    }

    saveAsset(data, editingId || null).then(function () {
      closeModal();
      toast(editingId ? 'تغییرات ذخیره شد' : 'دارایی جدید ثبت شد');
    }).catch(function () {
      document.getElementById('formError').textContent = 'ذخیره انجام نشد — دوباره تلاش کنید';
    });
  });

  /* ---------------- Transfer modal ---------------- */
  var transferOverlay = document.getElementById('transferOverlay');
  var transferForm = document.getElementById('transferForm');

  function openTransferModal(id) {
    var a = assets.find(function (x) { return x.id === id; });
    if (!a) return;
    document.getElementById('t_docId').value = id;
    document.getElementById('t_assetLabel').value = a.name + ' (' + a.code + ')';
    document.getElementById('t_assignee').value = '';
    document.getElementById('t_department').value = a.department || '';
    document.getElementById('t_phone').value = '';
    document.getElementById('t_location').value = a.location || '';
    document.getElementById('t_note').value = '';
    document.getElementById('transferError').textContent = '';
    transferOverlay.classList.remove('hidden');
    document.getElementById('t_assignee').focus();
  }
  function closeTransferModal() { transferOverlay.classList.add('hidden'); }

  document.getElementById('cancelTransfer').addEventListener('click', closeTransferModal);
  transferOverlay.addEventListener('click', function (e) { if (e.target === transferOverlay) closeTransferModal(); });

  transferForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('t_docId').value;
    var a = assets.find(function (x) { return x.id === id; });
    if (!a) return;
    var newAssignee = document.getElementById('t_assignee').value.trim();
    var newDept = document.getElementById('t_department').value.trim();
    var newPhone = document.getElementById('t_phone').value.trim();
    var newLocation = document.getElementById('t_location').value.trim();
    var note = document.getElementById('t_note').value.trim();
    if (!newAssignee || !newDept || !newPhone) {
      document.getElementById('transferError').textContent = 'همه فیلدهای ستاره‌دار الزامی هستند';
      return;
    }
    var now = nowIso();
    var history = (a.history || []).slice();
    history.push({ type: 'transferred', at: now, from: a.assignee, to: newAssignee, note: note || undefined });
    var data = {
      assignee: newAssignee,
      department: newDept,
      phone: newPhone,
      location: newLocation,
      status: 'inuse',
      updatedAt: now,
      history: history
    };
    saveAsset(data, id).then(function () {
      closeTransferModal();
      toast('انتقال با موفقیت ثبت شد');
    }).catch(function () {
      document.getElementById('transferError').textContent = 'ثبت انتقال انجام نشد — دوباره تلاش کنید';
    });
  });

})();
</script>
</body>
</html>
